<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Marvel Rivals Randomizer</title>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #05060a;
      --panel: #0d1017;
      --panel2: #121722;
      --line: #29303d;
      --text: #f5f7ff;
      --muted: #7e8798;
      --danger: #ff4d5a;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 50% 20%,
          #202735 0%,
          #0b0e15 38%,
          #05060a 75%
        );

      color: var(--text);

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    .app {
      width: min(1000px, 94%);
      margin: auto;
      padding: 35px 0 50px;
      text-align: center;
    }

    .brand {
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 5px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(35px, 9vw, 78px);
      line-height: .9;
      font-weight: 950;
      letter-spacing: 3px;
    }

    .subtitle {
      margin-top: 14px;
      color: var(--muted);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 4px;
    }


    /* =========================
       CONTROLS
    ========================= */

    .controls {
      margin-top: 32px;
      padding: 18px;

      border: 1px solid var(--line);
      border-radius: 20px;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.035),
          rgba(255,255,255,.012)
        );

      box-shadow:
        0 20px 60px rgba(0,0,0,.3);
    }

    .control-title {
      margin-bottom: 12px;

      color: var(--muted);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    .role-buttons,
    .count-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-button,
    .count-button,
    .exclude-button,
    .close-button,
    .clear-button {
      border: 1px solid var(--line);

      background: #090c12;
      color: #929aaa;

      padding: 11px 15px;

      border-radius: 10px;

      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1px;

      cursor: pointer;

      transition: .18s ease;
    }

    .filter-button:hover,
    .count-button:hover,
    .exclude-button:hover,
    .close-button:hover,
    .clear-button:hover {
      border-color: #626b7c;
      color: white;
    }

    .filter-button.active,
    .count-button.active {
      background: #f3f4f6;
      color: #05060a;
      border-color: #f3f4f6;
    }

    .exclude-button {
      width: 100%;
      margin-top: 20px;

      color: #ff8790;
      border-color: rgba(255,77,90,.25);
    }

    .exclude-button:hover {
      color: white;
      border-color: var(--danger);
    }

    .control-group + .control-group {
      margin-top: 20px;
    }


    /* =========================
       EXCLUSION PANEL
    ========================= */

    .exclude-panel {
      display: none;

      margin-top: 15px;

      padding: 18px;

      border: 1px solid var(--line);
      border-radius: 18px;

      background:
        #080a0f;

      text-align: left;
    }

    .exclude-panel.open {
      display: block;
    }

    .exclude-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      margin-bottom: 15px;
    }

    .exclude-title {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .exclude-count {
      color: var(--danger);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .exclude-actions {
      display: flex;
      gap: 7px;
      margin-bottom: 15px;
    }

    .clear-button {
      flex: 1;
      font-size: 9px;
      padding: 9px;
    }

    .hero-list {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(145px, 1fr)
        );

      gap: 7px;

      max-height: 360px;
      overflow-y: auto;

      padding-right: 3px;
    }

    .hero-option {
      position: relative;

      display: flex;
      align-items: center;

      min-height: 42px;

      padding: 9px;

      border: 1px solid #1d222d;
      border-radius: 9px;

      background: #0c0f15;

      cursor: pointer;

      transition: .15s ease;
    }

    .hero-option:hover {
      border-color: #4a5262;
    }

    .hero-option.excluded {
      opacity: .4;

      border-color:
        rgba(255,77,90,.4);

      background:
        rgba(255,77,90,.04);
    }

    .hero-option input {
      display: none;
    }

    .hero-check {
      width: 15px;
      height: 15px;

      margin-right: 8px;

      border: 1px solid #4a5262;
      border-radius: 4px;

      flex-shrink: 0;
    }

    .hero-option.excluded .hero-check {
      border-color: var(--danger);
      background: var(--danger);

      position: relative;
    }

    .hero-option.excluded .hero-check::after {
      content: "×";

      position: absolute;

      left: 2px;
      top: -2px;

      color: white;

      font-size: 13px;
      font-weight: bold;
    }

    .hero-name {
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .5px;
    }

    .hero-role {
      margin-top: 3px;

      color: #596171;

      font-size: 7px;
      font-weight: bold;
      letter-spacing: .5px;
    }


    /* =========================
       DISPLAY
    ========================= */

    .display {
      position: relative;

      margin: 30px auto;

      min-height: 350px;

      border: 1px solid var(--line);
      border-radius: 28px;

      background:
        radial-gradient(
          circle at 50% 40%,
          #252d3b 0%,
          #11151e 42%,
          #080a0f 80%
        );

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      box-shadow:
        0 30px 100px rgba(0,0,0,.55),
        inset 0 0 100px rgba(255,255,255,.025);

      transition: .4s ease;
    }

    .display::before {
      content: "";

      position: absolute;
      inset: 18px;

      border: 1px solid rgba(255,255,255,.045);
      border-radius: 20px;
    }

    .display::after {
      content: "";

      position: absolute;

      width: 550px;
      height: 550px;

      background:
        radial-gradient(
          circle,
          rgba(255,255,255,.07),
          transparent 67%
        );

      pointer-events: none;
    }


    /* =========================
       RESULTS
    ========================= */

    .results {
      position: relative;
      z-index: 3;

      width: 100%;
      padding: 35px 20px;
    }

    .result-grid {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(180px, 1fr)
        );

      gap: 18px;

      max-width: 850px;
      margin: auto;
    }

    .result-card {
      padding: 25px 15px;

      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;

      background:
        rgba(255,255,255,.025);

      box-shadow:
        inset 0 0 40px rgba(255,255,255,.015);

      opacity: 0;

      transform:
        scale(.85)
        translateY(15px);

      transition: .35s ease;
    }

    .result-card.show {
      opacity: 1;

      transform:
        scale(1)
        translateY(0);
    }

    .result-number {
      color: #626b7c;

      font-size: 9px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    .character-name {
      margin-top: 12px;

      font-size: clamp(25px, 6vw, 52px);

      line-height: .95;

      font-weight: 950;
      letter-spacing: 2px;

      text-shadow:
        0 0 30px rgba(255,255,255,.12);
    }

    .character-role {
      margin-top: 12px;

      color: var(--muted);

      font-size: 9px;
      font-weight: 900;
      letter-spacing: 3px;
    }


    /* =========================
       ANIMATION
    ========================= */

    .randomizing .result-card {
      opacity: 1;
      transform: scale(1.02);
    }

    .winner {
      border-color:
        rgba(255,255,255,.3);

      box-shadow:
        0 0 70px rgba(255,255,255,.08),
        0 30px 100px rgba(0,0,0,.6),
        inset 0 0 100px rgba(255,255,255,.04);
    }

    .winner .result-card.show {
      animation:
        winner .65s ease forwards;
    }

    @keyframes winner {

      0% {
        transform:
          scale(.72)
          translateY(10px);

        filter:
          blur(12px);
      }

      55% {
        transform:
          scale(1.08)
          translateY(0);

        filter:
          blur(0);
      }

      100% {
        transform:
          scale(1);
      }

    }


    /* =========================
       STATUS
    ========================= */

    .status {
      height: 18px;

      margin-top: 18px;

      color: var(--muted);

      font-size: 10px;
      font-weight: 900;
      letter-spacing: 4px;
    }


    /* =========================
       RANDOM BUTTON
    ========================= */

    .random-button {
      appearance: none;

      border: 0;

      width: min(420px, 100%);

      padding: 20px;

      border-radius: 14px;

      background:
        linear-gradient(
          180deg,
          #ffffff,
          #dfe2e8
        );

      color: #05060a;

      font-size: 15px;
      font-weight: 950;

      letter-spacing: 3px;

      cursor: pointer;

      box-shadow:
        0 15px 45px rgba(0,0,0,.4);

      transition:
        transform .15s ease,
        box-shadow .15s ease,
        opacity .15s ease;
    }

    .random-button:hover {
      transform:
        translateY(-2px);

      box-shadow:
        0 20px 55px rgba(0,0,0,.5);
    }

    .random-button:active {
      transform:
        scale(.97);
    }

    .random-button:disabled {
      opacity: .55;
      cursor: default;
    }

    .hint {
      margin-top: 20px;

      color: #505867;

      font-size: 9px;

      font-weight: bold;

      letter-spacing: 2px;
    }


    @media(max-width:600px) {

      .app {
        padding-top: 25px;
      }

      .display {
        min-height: 330px;
        border-radius: 22px;
      }

      .controls {
        padding: 14px;
      }

      .filter-button,
      .count-button {
        flex: 1;
        min-width: 90px;
      }

      .hero-list {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }

  </style>
</head>


<body>

<main class="app">

  <div class="brand">
    SUPER PHOENIX SPORTS
  </div>

  <h1>
    MARVEL RIVALS
  </h1>

  <div class="subtitle">
    ESPORTS RANDOMIZER
  </div>


  <!-- CONTROLES -->

  <section class="controls">

    <div class="control-group">

      <div class="control-title">
        ROLE
      </div>

      <div class="role-buttons">

        <button
          class="filter-button active"
          data-role="ALL"
          onclick="setRole('ALL')"
        >
          TODOS
        </button>

        <button
          class="filter-button"
          data-role="VANGUARD"
          onclick="setRole('VANGUARD')"
        >
          🛡 VANGUARD
        </button>

        <button
          class="filter-button"
          data-role="DUELIST"
          onclick="setRole('DUELIST')"
        >
          ⚔ DUELIST
        </button>

        <button
          class="filter-button"
          data-role="STRATEGIST"
          onclick="setRole('STRATEGIST')"
        >
          ◆ STRATEGIST
        </button>

      </div>

    </div>


    <div class="control-group">

      <div class="control-title">
        NUMBER OF CHARACTERS
      </div>

      <div class="count-buttons">

        <button
          class="count-button active"
          data-count="1"
          onclick="setCount(1)"
        >
          1
        </button>

        <button
          class="count-button"
          data-count="2"
          onclick="setCount(2)"
        >
          2
        </button>

        <button
          class="count-button"
          data-count="3"
          onclick="setCount(3)"
        >
          3
        </button>

      </div>

    </div>


    <button
      class="exclude-button"
      onclick="toggleExcludePanel()"
    >
      🚫 EXCLUIR PERSONAJES
    </button>


    <!-- EXCLUSIONES -->

    <div
      class="exclude-panel"
      id="excludePanel"
    >

      <div class="exclude-header">

        <div class="exclude-title">
          EXCLUDED HEROES
        </div>

        <div
          class="exclude-count"
          id="excludeCount"
        >
          0 EXCLUDED
        </div>

      </div>


      <div class="exclude-actions">

        <button
          class="clear-button"
          onclick="clearExcluded()"
        >
          ✓ LIMPIAR TODO
        </button>

        <button
          class="clear-button"
          onclick="excludeAll()"
        >
          × EXCLUIR TODOS
        </button>

      </div>


      <div
        class="hero-list"
        id="heroList"
      >
      </div>

    </div>

  </section>


  <div
    class="status"
    id="status"
  >
    READY
  </div>


  <!-- DISPLAY -->

  <section
    class="display"
    id="display"
  >

    <div
      class="results"
      id="results"
    >

      <div class="result-grid">

        <div class="result-card show">

          <div class="result-number">
            READY
          </div>

          <div class="character-name">
            ?
          </div>

          <div class="character-role">
            SELECT YOUR OPTIONS
          </div>

        </div>

      </div>

    </div>

  </section>


  <button
    class="random-button"
    id="randomButton"
    onclick="randomizeCharacters()"
  >
    ⚡ RANDOMIZE
  </button>


  <div class="hint">
    SUPER PHOENIX SPORTS • MARVEL RIVALS
  </div>

</main>


<script src="characters.js"></script>


<script>

  let selectedRole = "ALL";

  let selectedCount = 1;

  let spinning = false;

  let audioContext = null;

  let excludedCharacters =
    new Set();


  /* =========================
     AUDIO
  ========================= */

  function initAudio() {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if (
      audioContext.state === "suspended"
    ) {

      audioContext.resume();

    }

  }


  function playTick(intensity = 1) {

    if (!audioContext) return;

    const now =
      audioContext.currentTime;

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type =
      "triangle";

    oscillator.frequency.setValueAtTime(
      180 + intensity * 100,
      now
    );

    gain.gain.setValueAtTime(
      0.0001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      0.06 * intensity,
      now + .005
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      now + .05
    );

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );

    oscillator.start(now);

    oscillator.stop(
      now + .055
    );

  }


  function playFinalSound() {

    if (!audioContext) return;

    const now =
      audioContext.currentTime;


    const bass =
      audioContext.createOscillator();

    const bassGain =
      audioContext.createGain();

    bass.type =
      "sine";

    bass.frequency.setValueAtTime(
      110,
      now
    );

    bass.frequency.exponentialRampToValueAtTime(
      45,
      now + .5
    );

    bassGain.gain.setValueAtTime(
      .0001,
      now
    );

    bassGain.gain.exponentialRampToValueAtTime(
      .35,
      now + .02
    );

    bassGain.gain.exponentialRampToValueAtTime(
      .0001,
      now + .55
    );

    bass.connect(
      bassGain
    );

    bassGain.connect(
      audioContext.destination
    );

    bass.start(now);

    bass.stop(
      now + .6
    );


    const shine =
      audioContext.createOscillator();

    const shineGain =
      audioContext.createGain();

    shine.type =
      "triangle";

    shine.frequency.setValueAtTime(
      450,
      now
    );

    shine.frequency.exponentialRampToValueAtTime(
      950,
      now + .35
    );

    shineGain.gain.setValueAtTime(
      .0001,
      now
    );

    shineGain.gain.exponentialRampToValueAtTime(
      .12,
      now + .02
    );

    shineGain.gain.exponentialRampToValueAtTime(
      .0001,
      now + .4
    );

    shine.connect(
      shineGain
    );

    shineGain.connect(
      audioContext.destination
    );

    shine.start(now);

    shine.stop(
      now + .45
    );

  }


  /* =========================
     EXCLUSION PANEL
  ========================= */

  function buildHeroList() {

    const list =
      document.getElementById(
        "heroList"
      );

    list.innerHTML = "";


    characters.forEach(
      character => {

        const option =
          document.createElement(
            "div"
          );

        option.className =
          "hero-option";


        if (
          excludedCharacters.has(
            character.name
          )
        ) {

          option.classList.add(
            "excluded"
          );

        }


        option.innerHTML = `

          <div class="hero-check"></div>

          <div>

            <div class="hero-name">
              ${character.name}
            </div>

            <div class="hero-role">
              ${character.role}
            </div>

          </div>

        `;


        option.onclick =
          () => {

            toggleExcluded(
              character.name,
              option
            );

          };


        list.appendChild(
          option
        );

      }
    );


    updateExcludeCount();

  }


  function toggleExcludePanel() {

    const panel =
      document.getElementById(
        "excludePanel"
      );

    panel.classList.toggle(
      "open"
    );


    if (
      panel.classList.contains(
        "open"
      )
    ) {

      buildHeroList();

    }

  }


  function toggleExcluded(
    name,
    element
  ) {

    if (
      excludedCharacters.has(name)
    ) {

      excludedCharacters.delete(
        name
      );

      element.classList.remove(
        "excluded"
      );

    } else {

      excludedCharacters.add(
        name
      );

      element.classList.add(
        "excluded"
      );

    }


    updateExcludeCount();

  }


  function updateExcludeCount() {

    const counter =
      document.getElementById(
        "excludeCount"
      );


    const amount =
      excludedCharacters.size;


    counter.textContent =
      amount +
      (
        amount === 1
          ? " EXCLUDED"
          : " EXCLUDED"
      );

  }


  function clearExcluded() {

    excludedCharacters.clear();

    buildHeroList();

  }


  function excludeAll() {

    characters.forEach(
      character => {

        excludedCharacters.add(
          character.name
        );

      }
    );

    buildHeroList();

  }


  /* =========================
     ROLE
  ========================= */

  function setRole(role) {

    if (spinning) return;

    selectedRole =
      role;


    document
      .querySelectorAll(
        ".filter-button"
      )
      .forEach(button => {

        button.classList.toggle(
          "active",
          button.dataset.role === role
        );

      });

  }


  /* =========================
     COUNT
  ========================= */

  function setCount(count) {

    if (spinning) return;

    selectedCount =
      count;


    document
      .querySelectorAll(
        ".count-button"
      )
      .forEach(button => {

        button.classList.toggle(
          "active",
          Number(button.dataset.count) === count
        );

      });

  }


  /* =========================
     AVAILABLE CHARACTERS
  ========================= */

  function getAvailableCharacters() {

    return characters.filter(
      character => {

        if (
          excludedCharacters.has(
            character.name
          )
        ) {

          return false;

        }


        if (
          selectedRole === "ALL"
        ) {

          return true;

        }


        return character.role
          .split("/")
          .map(
            role =>
              role.trim()
          )
          .includes(
            selectedRole
          );

      }
    );

  }


  /* =========================
     UNIQUE RANDOM
  ========================= */

  function getRandomCharacters(
    pool,
    amount
  ) {

    const available =
      [...pool];

    const selected = [];


    while (
      selected.length < amount &&
      available.length > 0
    ) {

      const index =
        Math.floor(
          Math.random() *
          available.length
        );


      selected.push(
        available[index]
      );


      available.splice(
        index,
        1
      );

    }


    return selected;

  }


  /* =========================
     RENDER
  ========================= */

  function renderCharacters(
    list,
    visible = true
  ) {

    const results =
      document.getElementById(
        "results"
      );


    const grid =
      document.createElement(
        "div"
      );


    grid.className =
      "result-grid";


    list.forEach(
      (character, index) => {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "result-card";


        card.innerHTML = `

          <div class="result-number">
            RESULT ${index + 1}
          </div>

          <div class="character-name">
            ${character.name}
          </div>

          <div class="character-role">
            ${character.role}
          </div>

        `;


        grid.appendChild(
          card
        );

      }
    );


    results.innerHTML = "";

    results.appendChild(
      grid
    );


    if (visible) {

      requestAnimationFrame(
        () => {

          grid
            .querySelectorAll(
              ".result-card"
            )
            .forEach(
              (card, index) => {

                setTimeout(
                  () => {

                    card.classList.add(
                      "show"
                    );

                  },
                  index * 100
                );

              }
            );

        }
      );

    }

  }


  /* =========================
     RANDOMIZER
  ========================= */

  function randomizeCharacters() {

    if (spinning) return;


    initAudio();


    const pool =
      getAvailableCharacters();


    if (
      pool.length < selectedCount
    ) {

      alert(
        "No hay suficientes personajes disponibles."
      );

      return;

    }


    spinning =
      true;


    const button =
      document.getElementById(
        "randomButton"
      );

    const display =
      document.getElementById(
        "display"
      );

    const status =
      document.getElementById(
        "status"
      );


    button.disabled =
      true;


    display.classList.remove(
      "winner"
    );

    display.classList.add(
      "randomizing"
    );


    status.textContent =
      "SELECTING";


    const finalCharacters =
      getRandomCharacters(
        pool,
        selectedCount
      );


    const duration =
      3000;

    const start =
      performance.now();

    let lastTick =
      0;


    function animate(now) {

      const elapsed =
        now - start;


      const progress =
        Math.min(
          elapsed / duration,
          1
        );


      const speed =
        35 +
        Math.pow(
          progress,
          3
        ) * 220;


      if (
        now - lastTick >
        speed
      ) {

        lastTick =
          now;


        const preview =
          getRandomCharacters(
            pool,
            selectedCount
          );


        renderCharacters(
          preview,
          false
        );


        playTick(
          .5 +
          progress * .5
        );

      }


      if (
        progress < 1
      ) {

        requestAnimationFrame(
          animate
        );

      } else {

        finish();

      }

    }


    function finish() {

      renderCharacters(
        finalCharacters,
        true
      );


      status.textContent =
        "SELECTED";


      display.classList.remove(
        "randomizing"
      );

      display.classList.add(
        "winner"
      );


      playFinalSound();


      button.disabled =
        false;

      spinning =
        false;

    }


    requestAnimationFrame(
      animate
    );

  }


  /* =========================
     INITIALIZE
  ========================= */

  buildHeroList();

</script>

</body>
</html>
