<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Marvel Rivals Randomizer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #05060a;
      --panel: #10131b;
      --line: #292e3b;
      --text: #f5f7ff;
      --muted: #7f8798;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;

      background:
        radial-gradient(
          circle at 50% 35%,
          #202633 0%,
          #0c0f16 38%,
          #05060a 75%
        );

      color: var(--text);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: min(950px, 92%);
      text-align: center;
      padding: 40px 0;
    }

    .brand {
      color: var(--muted);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 5px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;

      font-size: clamp(34px, 8vw, 78px);
      line-height: 0.95;

      letter-spacing: 4px;
      font-weight: 900;
    }

    .status {
      margin-top: 15px;
      height: 20px;

      color: var(--muted);
      font-size: 11px;
      letter-spacing: 4px;
      font-weight: bold;
    }

    .display {
      position: relative;

      margin: 40px auto 30px;

      width: 100%;
      min-height: 330px;

      border: 1px solid var(--line);
      border-radius: 28px;

      background:
        radial-gradient(
          circle at 50% 40%,
          #242b39 0%,
          #11151e 42%,
          #090b10 80%
        );

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      box-shadow:
        0 30px 100px rgba(0,0,0,0.5),
        inset 0 0 80px rgba(255,255,255,0.025);

      transition:
        box-shadow 0.4s ease,
        border-color 0.4s ease;
    }

    .display::before {
      content: "";

      position: absolute;
      inset: 20px;

      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 20px;

      pointer-events: none;
    }

    .display::after {
      content: "";

      position: absolute;

      width: 500px;
      height: 500px;

      background:
        radial-gradient(
          circle,
          rgba(255,255,255,0.07),
          transparent 65%
        );

      pointer-events: none;
    }

    .character {
      position: relative;
      z-index: 2;

      transition:
        transform 0.15s ease,
        filter 0.15s ease;
    }

    .character-name {
      font-size: clamp(38px, 10vw, 95px);
      font-weight: 900;
      letter-spacing: 3px;

      text-shadow:
        0 0 30px rgba(255,255,255,0.12);
    }

    .character-role {
      margin-top: 14px;

      color: var(--muted);

      font-size: 12px;
      font-weight: bold;
      letter-spacing: 6px;
    }

    .randomizing .character {
      transform: scale(1.025);
      filter: blur(0.4px);
    }

    .winner {
      border-color: rgba(255,255,255,0.28);

      box-shadow:
        0 0 70px rgba(255,255,255,0.08),
        0 30px 100px rgba(0,0,0,0.6),
        inset 0 0 100px rgba(255,255,255,0.035);
    }

    .winner .character {
      animation: winner 0.7s ease forwards;
    }

    @keyframes winner {

      0% {
        transform: scale(0.8);
        opacity: 0;
        filter: blur(12px);
      }

      55% {
        transform: scale(1.12);
        opacity: 1;
        filter: blur(0);
      }

      100% {
        transform: scale(1);
      }

    }

    button {
      appearance: none;
      border: 0;

      padding: 21px 48px;

      border-radius: 14px;

      background: #f4f5f7;
      color: #07080b;

      font-size: 16px;
      font-weight: 900;
      letter-spacing: 3px;

      cursor: pointer;

      box-shadow:
        0 12px 35px rgba(0,0,0,0.35);

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 16px 45px rgba(0,0,0,0.45);
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      cursor: default;
      opacity: 0.7;
    }

    .hint {
      margin-top: 22px;

      color: #555c6c;

      font-size: 10px;
      letter-spacing: 2px;
    }

    @media (max-width: 600px) {

      .app {
        padding: 25px 0;
      }

      .display {
        min-height: 280px;
        border-radius: 22px;
      }

      button {
        width: 100%;
      }

    }
  </style>
</head>


<body>

  <main class="app">

    <div class="brand">
      SUPER PHOENIX SPORTS
    </div>

    <h1>
      MARVEL RIVALS
    </h1>

    <div
      class="status"
      id="status"
    >
      RANDOMIZER
    </div>


    <section
      class="display"
      id="display"
    >

      <div class="character">

        <div
          class="character-name"
          id="characterName"
        >
          READY
        </div>

        <div
          class="character-role"
          id="characterRole"
        >
          PRESS RANDOMIZE
        </div>

      </div>

    </section>


    <button
      id="randomButton"
      onclick="randomizeCharacter()"
    >
      ⚡ RANDOMIZE
    </button>


    <div class="hint">
      SUPER PHOENIX SPORTS • MARVEL RIVALS RANDOMIZER
    </div>

  </main>


  <!--
    Los personajes están en un archivo separado.
  -->

  <script src="characters.js"></script>


  <script>

    /*
      ============================================
      AUDIO
      ============================================
    */

    let audioContext = null;


    function initAudio() {

      if (!audioContext) {

        audioContext =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();

      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

    }


    function playTick(intensity = 1) {

      if (!audioContext) return;

      const now =
        audioContext.currentTime;


      const oscillator =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();


      oscillator.type = "triangle";


      oscillator.frequency.setValueAtTime(
        180 + intensity * 80,
        now
      );


      gain.gain.setValueAtTime(
        0.0001,
        now
      );


      gain.gain.exponentialRampToValueAtTime(
        0.08 * intensity,
        now + 0.005
      );


      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.055
      );


      oscillator.connect(gain);
      gain.connect(audioContext.destination);


      oscillator.start(now);
      oscillator.stop(now + 0.06);

    }


    function playFinalSound() {

      if (!audioContext) return;

      const now =
        audioContext.currentTime;


      /*
        IMPACTO GRAVE
      */

      const bass =
        audioContext.createOscillator();

      const bassGain =
        audioContext.createGain();


      bass.type = "sine";


      bass.frequency.setValueAtTime(
        100,
        now
      );


      bass.frequency.exponentialRampToValueAtTime(
        42,
        now + 0.45
      );


      bassGain.gain.setValueAtTime(
        0.0001,
        now
      );


      bassGain.gain.exponentialRampToValueAtTime(
        0.4,
        now + 0.015
      );


      bassGain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.5
      );


      bass.connect(bassGain);
      bassGain.connect(audioContext.destination);


      bass.start(now);
      bass.stop(now + 0.55);


      /*
        TONO BRILLANTE
      */

      const shine =
        audioContext.createOscillator();

      const shineGain =
        audioContext.createGain();


      shine.type = "triangle";


      shine.frequency.setValueAtTime(
        420,
        now
      );


      shine.frequency.exponentialRampToValueAtTime(
        900,
        now + 0.35
      );


      shineGain.gain.setValueAtTime(
        0.0001,
        now
      );


      shineGain.gain.exponentialRampToValueAtTime(
        0.12,
        now + 0.02
      );


      shineGain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.4
      );


      shine.connect(shineGain);
      shineGain.connect(audioContext.destination);


      shine.start(now);
      shine.stop(now + 0.45);

    }


    /*
      ============================================
      RANDOMIZER
      ============================================
    */

    let spinning = false;


    function randomizeCharacter() {

      if (spinning) return;


      initAudio();


      spinning = true;


      const button =
        document.getElementById(
          "randomButton"
        );


      const display =
        document.getElementById(
          "display"
        );


      const name =
        document.getElementById(
          "characterName"
        );


      const role =
        document.getElementById(
          "characterRole"
        );


      const status =
        document.getElementById(
          "status"
        );


      button.disabled = true;


      display.classList.remove(
        "winner"
      );


      display.classList.add(
        "randomizing"
      );


      status.textContent =
        "SELECTING";


      /*
        RESULTADO FINAL
      */

      const finalIndex =
        Math.floor(
          Math.random() *
          characters.length
        );


      /*
        DURACIÓN
      */

      const duration =
        3000;


      const start =
        performance.now();


      let lastCharacter =
        -1;


      function animate(now) {

        const elapsed =
          now - start;


        const progress =
          Math.min(
            elapsed / duration,
            1
          );


        /*
          FRENADO SUAVE
        */

        const eased =
          1 -
          Math.pow(
            1 - progress,
            4
          );


        let index;


        /*
          Primera parte:
          personajes aleatorios.

          Parte final:
          nos acercamos al ganador.
        */

        if (progress < 0.88) {

          index =
            Math.floor(
              Math.random() *
              characters.length
            );

        } else {

          index =
            finalIndex;

        }


        if (index !== lastCharacter) {

          const character =
            characters[index];


          name.textContent =
            character.name;


          role.textContent =
            character.role;


          lastCharacter =
            index;


          const intensity =
            0.4 +
            progress * 0.6;


          playTick(
            intensity
          );

        }


        if (progress < 1) {

          requestAnimationFrame(
            animate
          );

        } else {

          finishSelection();

        }

      }


      requestAnimationFrame(
        animate
      );


      function finishSelection() {

        const character =
          characters[finalIndex];


        name.textContent =
          character.name;


        role.textContent =
          character.role;


        status.textContent =
          "SELECTED";


        display.classList.remove(
          "randomizing"
        );


        display.classList.add(
          "winner"
        );


        playFinalSound();


        button.disabled =
          false;


        spinning =
          false;

      }

    }

  </script>

</body>
</html>
