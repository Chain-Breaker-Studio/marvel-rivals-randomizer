<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marvel Rivals Randomizer — Super Phoenix Sports</title>

<style>
:root {
    --bg: #080808;
    --bg2: #111111;

    --panel: #151515;
    --panel2: #1d1d1d;

    --line: #343434;

    --text: #ffffff;
    --muted: #a6a6a6;

    --red: #e52323;
    --red-dark: #9e1010;

    --gold: #f5b72f;
    --gold-light: #ffd86a;

    --green: #43e27d;

    --shadow: 0 18px 50px rgba(0,0,0,.45);
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background:
        radial-gradient(circle at 50% -10%, rgba(229,35,35,.16), transparent 34%),
        radial-gradient(circle at 90% 90%, rgba(245,183,47,.06), transparent 30%),
        linear-gradient(145deg, #050505, #101010 55%, #080808);

    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================================================
   APP
========================================================= */

.app {
    width: min(1180px, 94vw);
    min-height: 100vh;
    margin: 0 auto;

    display: flex;
    flex-direction: column;

    padding: clamp(14px, 2vh, 24px) 0;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    position: relative;
    text-align: center;
    flex-shrink: 0;

    margin-bottom: clamp(10px, 1.8vh, 20px);
}

.brand {
    display: inline-flex;
    align-items: center;
    gap: 9px;

    color: #ffffff;
    font-size: clamp(12px, 1vw, 15px);
    font-weight: 900;
    letter-spacing: .16em;

    text-transform: uppercase;
}

.brand::before {
    content: "";
    width: 7px;
    height: 7px;

    background: var(--red);

    transform: rotate(45deg);

    box-shadow:
        0 0 0 3px rgba(229,35,35,.12),
        0 0 16px rgba(229,35,35,.45);
}

.title {
    margin: 5px 0 0;

    font-size: clamp(34px, 4.3vw, 64px);
    line-height: .9;

    font-weight: 1000;
    letter-spacing: -.045em;

    text-transform: uppercase;

    text-shadow:
        0 3px 0 #000,
        0 8px 30px rgba(0,0,0,.7);
}

.title span {
    color: var(--red);
}

.subtitle {
    margin-top: 7px;

    color: var(--gold);
    font-size: clamp(10px, .9vw, 13px);

    font-weight: 900;
    letter-spacing: .25em;

    text-transform: uppercase;
}

/* =========================================================
   TOP BAR
========================================================= */

.top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;

    margin-bottom: clamp(8px, 1.5vh, 16px);
}

.mode-indicator {
    display: inline-flex;
    align-items: center;
    gap: 7px;

    color: var(--muted);

    font-size: 10px;
    font-weight: 900;
    letter-spacing: .14em;
    text-transform: uppercase;
}

.mode-indicator::before {
    content: "";

    width: 6px;
    height: 6px;

    border-radius: 50%;
    background: var(--green);

    box-shadow: 0 0 10px rgba(67,226,125,.7);
}

.broadcast-toggle {
    border: 1px solid #444;
    background: #151515;

    color: #fff;

    padding: 7px 12px;

    font-size: 10px;
    font-weight: 900;
    letter-spacing: .12em;

    cursor: pointer;

    text-transform: uppercase;

    transition: .18s ease;
}

.broadcast-toggle:hover {
    border-color: var(--gold);
    color: var(--gold);
}

.broadcast-toggle.active {
    background: var(--red);
    border-color: var(--red);

    color: white;

    box-shadow: 0 0 18px rgba(229,35,35,.3);
}

/* =========================================================
   CONTROLS
========================================================= */

.controls {
    display: grid;
    grid-template-columns: 1.4fr .8fr auto;
    gap: 10px;

    flex-shrink: 0;

    margin-bottom: clamp(9px, 1.5vh, 16px);
}

.control-group {
    background: rgba(21,21,21,.94);

    border: 1px solid var(--line);

    padding: 9px;

    box-shadow: var(--shadow);
}

.control-label {
    display: block;

    margin-bottom: 7px;

    color: #777;

    font-size: 9px;
    font-weight: 900;
    letter-spacing: .15em;

    text-transform: uppercase;
}

.button-row {
    display: flex;
    gap: 5px;
}

.option-btn {
    flex: 1;

    min-height: 31px;

    border: 1px solid #3a3a3a;
    background: #101010;

    color: #aaa;

    font-size: 10px;
    font-weight: 900;
    letter-spacing: .05em;

    cursor: pointer;

    transition: .15s ease;
}

.option-btn:hover {
    color: #fff;
    border-color: #777;
}

.option-btn.active {
    background: var(--red);
    border-color: var(--red);

    color: white;

    box-shadow:
        inset 0 -2px 0 rgba(0,0,0,.25),
        0 0 12px rgba(229,35,35,.2);
}

.exclude-btn {
    width: 100%;

    min-height: 31px;

    border: 1px solid #3a3a3a;
    background: #101010;

    color: #aaa;

    font-size: 10px;
    font-weight: 900;
    letter-spacing: .05em;

    cursor: pointer;

    transition: .15s ease;
}

.exclude-btn:hover {
    border-color: var(--gold);
    color: var(--gold);
}

/* =========================================================
   EXCLUSION PANEL
========================================================= */

.exclude-panel {
    display: none;

    background: #111;
    border: 1px solid var(--line);

    padding: 10px;

    margin-bottom: 10px;

    flex-shrink: 0;
}

.exclude-panel.open {
    display: block;
}

.exclude-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 8px;
}

.exclude-title {
    font-size: 10px;
    font-weight: 900;
    letter-spacing: .12em;

    text-transform: uppercase;
}

.exclude-actions {
    display: flex;
    gap: 5px;
}

.small-btn {
    border: 1px solid #3c3c3c;
    background: #181818;

    color: #aaa;

    padding: 5px 8px;

    font-size: 8px;
    font-weight: 900;

    cursor: pointer;
}

.small-btn:hover {
    color: white;
    border-color: var(--gold);
}

.hero-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));

    gap: 4px;

    max-height: 190px;
    overflow-y: auto;
}

.hero-option {
    display: flex;
    align-items: center;
    gap: 6px;

    padding: 5px 7px;

    background: #171717;
    border: 1px solid #292929;

    cursor: pointer;
}

.hero-option:hover {
    border-color: #555;
}

.hero-option input {
    accent-color: var(--red);
}

.hero-option-name {
    font-size: 9px;
    font-weight: 800;
}

.hero-option-role {
    margin-left: auto;

    color: #666;

    font-size: 7px;
    font-weight: 900;
}

/* =========================================================
   RANDOMIZER STAGE
========================================================= */

.stage {
    position: relative;

    flex: 1;
    min-height: 0;

    display: flex;
    flex-direction: column;

    background:
        linear-gradient(
            135deg,
            rgba(229,35,35,.05),
            transparent 25%,
            transparent 75%,
            rgba(245,183,47,.04)
        ),
        #0d0d0d;

    border: 1px solid #303030;

    box-shadow:
        0 25px 70px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.025);

    overflow: hidden;
}

/* comic diagonal accents */

.stage::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 180px;
    height: 5px;

    background: var(--red);

    transform: skewX(-35deg);
    transform-origin: left top;
}

.stage::after {
    content: "";

    position: absolute;

    right: -60px;
    bottom: 30px;

    width: 210px;
    height: 4px;

    background: var(--gold);

    transform: rotate(-35deg);
    opacity: .7;
}

/* =========================================================
   STATUS
========================================================= */

.status-bar {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 8px;

    padding: 8px 12px;

    border-bottom: 1px solid #292929;

    flex-shrink: 0;
}

.status-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--green);

    box-shadow: 0 0 10px rgba(67,226,125,.6);
}

.status {
    color: #aaa;

    font-size: 9px;
    font-weight: 900;
    letter-spacing: .2em;

    text-transform: uppercase;
}

/* =========================================================
   RESULT DISPLAY
========================================================= */

.display {
    flex: 1;
    min-height: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: clamp(12px, 2vh, 24px);
}

.results {
    width: 100%;
    max-width: 920px;

    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));

    gap: clamp(9px, 1vw, 16px);
}

.result-card {
    position: relative;

    min-height: clamp(190px, 27vh, 310px);

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(229,35,35,.09),
            transparent 55%
        ),
        #151515;

    border: 1px solid #343434;

    overflow: hidden;

    opacity: 0;
    transform: scale(.94);

    transition:
        opacity .18s ease,
        transform .18s ease,
        border-color .18s ease;
}

.result-card.show {
    opacity: 1;
    transform: scale(1);
}

.result-card::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 45px;
    height: 3px;

    background: var(--red);
}

.result-card::after {
    content: "";

    position: absolute;

    right: 0;
    bottom: 0;

    width: 45px;
    height: 3px;

    background: var(--gold);
}

.result-number {
    position: absolute;

    top: 10px;
    left: 12px;

    color: #555;

    font-size: 9px;
    font-weight: 900;
    letter-spacing: .12em;
}

.result-placeholder {
    color: #777;

    font-size: clamp(40px, 5vw, 65px);
    font-weight: 1000;

    line-height: 1;
}

.result-name {
    margin-top: 15px;

    color: white;

    font-size: clamp(18px, 2vw, 28px);
    font-weight: 1000;
    letter-spacing: -.025em;

    text-transform: uppercase;
}

.result-role {
    margin-top: 6px;

    color: var(--gold);

    font-size: 8px;
    font-weight: 900;
    letter-spacing: .15em;

    text-transform: uppercase;
}

/* =========================================================
   ACTION
========================================================= */

.action-area {
    display: flex;
    justify-content: center;

    padding:
        0
        clamp(12px, 2vh, 22px)
        clamp(12px, 2vh, 20px);

    flex-shrink: 0;
}

.randomize-btn {
    position: relative;

    min-width: clamp(240px, 28vw, 360px);
    height: clamp(45px, 6vh, 58px);

    border: none;

    background:
        linear-gradient(
            180deg,
            #f02b2b,
            #bd1515
        );

    color: #fff;

    font-size: clamp(13px, 1.2vw, 17px);
    font-weight: 1000;
    letter-spacing: .12em;

    text-transform: uppercase;

    cursor: pointer;

    box-shadow:
        0 7px 0 #720b0b,
        0 12px 25px rgba(0,0,0,.4);

    transition:
        transform .12s ease,
        filter .12s ease;
}

.randomize-btn:hover {
    filter: brightness(1.1);
}

.randomize-btn:active {
    transform: translateY(5px);

    box-shadow:
        0 2px 0 #720b0b,
        0 6px 15px rgba(0,0,0,.4);
}

.randomize-btn:disabled {
    cursor: not-allowed;
    filter: grayscale(.4);
    opacity: .8;
}

.hint {
    text-align: center;

    margin-top: 8px;

    color: #555;

    font-size: 8px;
    font-weight: 900;
    letter-spacing: .16em;

    text-transform: uppercase;
}

/* =========================================================
   CREATOR
========================================================= */

.creator {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;

    margin-top: clamp(9px, 1.5vh, 15px);

    padding-top: 9px;

    border-top: 1px solid #242424;

    flex-shrink: 0;
}

.creator-main {
    display: flex;
    align-items: center;
    gap: 9px;
}

.creator-label {
    color: #555;

    font-size: 7px;
    font-weight: 900;
    letter-spacing: .15em;
}

.creator-name {
    color: #fff;

    font-size: 10px;
    font-weight: 1000;
    letter-spacing: .08em;

    text-transform: uppercase;
}

.creator-role {
    color: #777;

    font-size: 8px;
}

.creator-links {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.creator-links a {
    color: #777;

    font-size: 8px;
    font-weight: 900;
    letter-spacing: .04em;

    text-decoration: none;
}

.creator-links a:hover {
    color: var(--gold);
}

.build {
    color: #444;

    font-size: 7px;
    font-weight: 900;
}

/* =========================================================
   RANDOMIZING STATE
========================================================= */

.randomizing .result-card {
    border-color: var(--red);
}

.randomizing .result-name {
    color: var(--gold-light);
}

.winner .result-card {
    border-color: var(--gold);

    box-shadow:
        0 0 0 1px rgba(245,183,47,.15),
        0 0 35px rgba(245,183,47,.08);
}

/* =========================================================
   BROADCAST MODE
========================================================= */

body.broadcast-mode {
    overflow: hidden;
}

body.broadcast-mode .app {
    width: 96vw;

    padding-top: 1.2vh;
    padding-bottom: 1.2vh;
}

body.broadcast-mode .header {
    margin-bottom: 1vh;
}

body.broadcast-mode .brand {
    font-size: 10px;
}

body.broadcast-mode .title {
    font-size: clamp(32px, 4vw, 58px);
}

body.broadcast-mode .subtitle {
    margin-top: 4px;
    font-size: 9px;
}

body.broadcast-mode .controls,
body.broadcast-mode .exclude-panel,
body.broadcast-mode .creator,
body.broadcast-mode .hint {
    display: none;
}

body.broadcast-mode .top-bar {
    margin-bottom: .8vh;
}

body.broadcast-mode .mode-indicator {
    color: var(--gold);
}

body.broadcast-mode .stage {
    min-height: 0;
}

body.broadcast-mode .display {
    padding: 2vh 2vw;
}

body.broadcast-mode .results {
    max-width: 1200px;
    gap: 1.3vw;
}

body.broadcast-mode .result-card {
    min-height: 48vh;
}

body.broadcast-mode .result-placeholder {
    font-size: clamp(65px, 8vw, 120px);
}

body.broadcast-mode .result-name {
    font-size: clamp(25px, 3vw, 48px);
}

body.broadcast-mode .result-role {
    font-size: 10px;
}

body.broadcast-mode .action-area {
    padding-bottom: 2vh;
}

/* =========================================================
   COUNT-SPECIFIC RESULT LAYOUT
========================================================= */

.results.count-1 {
    grid-template-columns: minmax(240px, 600px);
    justify-content: center;
}

.results.count-2 {
    grid-template-columns: repeat(2, minmax(220px, 1fr));
    max-width: 800px;
}

.results.count-3 {
    grid-template-columns: repeat(3, minmax(180px, 1fr));
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 850px) {

    .app {
        width: 94vw;
    }

    .controls {
        grid-template-columns: 1fr;
    }

    .results {
        grid-template-columns: 1fr !important;
        max-width: 500px;
    }

    .result-card {
        min-height: 170px;
    }

    .creator {
        flex-direction: column;
        align-items: flex-start;
    }

    .creator-links {
        justify-content: flex-start;
    }

    body.broadcast-mode .result-card {
        min-height: 52vh;
    }
}

@media (max-height: 720px) and (min-width: 851px) {

    .app {
        padding-top: 9px;
        padding-bottom: 9px;
    }

    .header {
        margin-bottom: 7px;
    }

    .title {
        font-size: 38px;
    }

    .subtitle {
        margin-top: 4px;
    }

    .controls {
        margin-bottom: 7px;
    }

    .control-group {
        padding: 7px;
    }

    .control-label {
        margin-bottom: 4px;
    }

    .stage {
        min-height: 0;
    }

    .result-card {
        min-height: 155px;
    }

    .result-name {
        margin-top: 9px;
        font-size: 19px;
    }

    .action-area {
        padding-bottom: 8px;
    }

    .creator {
        margin-top: 7px;
        padding-top: 6px;
    }
}

/* =========================================================
   VERY WIDE BROADCAST
========================================================= */

@media (min-width: 1500px) {

    body.broadcast-mode .result-card {
        min-height: 55vh;
    }

    body.broadcast-mode .result-name {
        font-size: clamp(32px, 3vw, 54px);
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div class="brand">
            SUPER PHOENIX SPORTS
        </div>

        <h1 class="title">
            MARVEL <span>RIVALS</span>
        </h1>

        <div class="subtitle">
            ESPORTS RANDOMIZER
        </div>

    </header>


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <div class="top-bar">

        <div class="mode-indicator" id="modeIndicator">
            STANDARD MODE
        </div>

        <button
            class="broadcast-toggle"
            id="broadcastToggle"
            onclick="toggleBroadcastMode()"
        >
            BROADCAST MODE
        </button>

    </div>


    <!-- =====================================================
         CONTROLS
    ====================================================== -->

    <section class="controls">

        <div class="control-group">

            <span class="control-label">
                ROLE
            </span>

            <div class="button-row">

                <button
                    class="option-btn active"
                    data-role="ALL"
                    onclick="setRole('ALL')"
                >
                    ALL
                </button>

                <button
                    class="option-btn"
                    data-role="VANGUARD"
                    onclick="setRole('VANGUARD')"
                >
                    VANGUARD
                </button>

                <button
                    class="option-btn"
                    data-role="DUELIST"
                    onclick="setRole('DUELIST')"
                >
                    DUELIST
                </button>

                <button
                    class="option-btn"
                    data-role="STRATEGIST"
                    onclick="setRole('STRATEGIST')"
                >
                    STRATEGIST
                </button>

            </div>

        </div>


        <div class="control-group">

            <span class="control-label">
                CHARACTERS
            </span>

            <div class="button-row">

                <button
                    class="option-btn active"
                    data-count="1"
                    onclick="setCount(1)"
                >
                    1
                </button>

                <button
                    class="option-btn"
                    data-count="2"
                    onclick="setCount(2)"
                >
                    2
                </button>

                <button
                    class="option-btn"
                    data-count="3"
                    onclick="setCount(3)"
                >
                    3
                </button>

            </div>

        </div>


        <div class="control-group">

            <span class="control-label">
                FILTER
            </span>

            <button
                class="exclude-btn"
                onclick="toggleExcludePanel()"
            >
                🚫 EXCLUDE CHARACTERS
            </button>

        </div>

    </section>


    <!-- =====================================================
         EXCLUSION PANEL
    ====================================================== -->

    <section
        class="exclude-panel"
        id="excludePanel"
    >

        <div class="exclude-header">

            <div class="exclude-title">
                Character Exclusions
            </div>

            <div class="exclude-actions">

                <button
                    class="small-btn"
                    onclick="clearExcluded()"
                >
                    CLEAR
                </button>

                <button
                    class="small-btn"
                    onclick="excludeAll()"
                >
                    EXCLUDE ALL
                </button>

            </div>

        </div>

        <div
            class="hero-list"
            id="heroList"
        ></div>

    </section>


    <!-- =====================================================
         RANDOMIZER STAGE
    ====================================================== -->

    <main class="stage" id="stage">

        <div class="status-bar">

            <div class="status-dot"></div>

            <div
                class="status"
                id="status"
            >
                READY
            </div>

        </div>


        <div class="display">

            <div
                class="results count-1"
                id="results"
            >

                <div class="result-card show">

                    <div class="result-number">
                        SLOT 01
                    </div>

                    <div class="result-placeholder">
                        ?
                    </div>

                    <div class="result-name">
                        READY
                    </div>

                    <div class="result-role">
                        SELECT YOUR OPTIONS
                    </div>

                </div>

            </div>

        </div>


        <div class="action-area">

            <div>

                <button
                    class="randomize-btn"
                    id="randomizeBtn"
                    onclick="randomizeCharacters()"
                >
                    ⚡ RANDOMIZE
                </button>

                <div class="hint">
                    SUPER PHOENIX SPORTS • MARVEL RIVALS
                </div>

            </div>

        </div>

    </main>


    <!-- =====================================================
         CREATOR
    ====================================================== -->

    <footer class="creator">

        <div class="creator-main">

            <div>

                <div class="creator-label">
                    CREATED BY
                </div>

                <div class="creator-name">
                    DAENERYS84
                </div>

            </div>

            <div class="creator-role">
                Miembro Directivo // Quimera Guild
            </div>

        </div>


        <div class="creator-links">

            <a
                href="https://x.com/Daenerys_084"
                target="_blank"
                rel="noopener"
            >
                X
            </a>

            <a
                href="https://x.com/QuimeraSA_"
                target="_blank"
                rel="noopener"
            >
                QUIMERA
            </a>

            <a

<!-- =========================================================
     CHARACTER DATA
     DO NOT MODIFY characters.js
========================================================= -->

<script src="characters.js"></script>


<script>

/* =========================================================
   STATE
========================================================= */

let selectedRole = "ALL";
let selectedCount = 1;

let spinning = false;

let audioContext = null;

let excludedCharacters = new Set();


/* =========================================================
   AUDIO
========================================================= */

function initAudio() {

    if (!audioContext) {
        audioContext = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }
}


function playTick(intensity = 0.5) {

    if (!audioContext) return;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = "square";

    oscillator.frequency.value =
        140 + intensity * 160;

    gain.gain.setValueAtTime(
        0.035,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.045
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.05
    );
}


function playFinalSound() {

    if (!audioContext) return;

    const now = audioContext.currentTime;

    const frequencies = [
        420,
        560,
        720
    ];

    frequencies.forEach((frequency, index) => {

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type = "triangle";

        oscillator.frequency.value =
            frequency;

        gain.gain.setValueAtTime(
            0.0001,
            now + index * 0.08
        );

        gain.gain.exponentialRampToValueAtTime(
            0.14,
            now + index * 0.08 + 0.02
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + index * 0.08 + 0.35
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start(
            now + index * 0.08
        );

        oscillator.stop(
            now + index * 0.08 + 0.4
        );

    });
}


/* =========================================================
   EXCLUSION SYSTEM
========================================================= */

function buildHeroList() {

    const container =
        document.getElementById("heroList");

    if (!container || !Array.isArray(characters)) {
        return;
    }

    container.innerHTML = "";

    characters.forEach((character, index) => {

        const label =
            document.createElement("label");

        label.className = "hero-option";

        const checkbox =
            document.createElement("input");

        checkbox.type = "checkbox";

        checkbox.checked =
            excludedCharacters.has(character.name);

        checkbox.addEventListener(
            "change",
            () => toggleExcluded(
                character.name,
                checkbox.checked
            )
        );

        const name =
            document.createElement("span");

        name.className =
            "hero-option-name";

        name.textContent =
            character.name;

        const role =
            document.createElement("span");

        role.className =
            "hero-option-role";

        role.textContent =
            character.role;

        label.appendChild(checkbox);
        label.appendChild(name);
        label.appendChild(role);

        container.appendChild(label);

    });

    updateExcludeCount();
}


function toggleExcluded(name, excluded) {

    if (excluded) {
        excludedCharacters.add(name);
    } else {
        excludedCharacters.delete(name);
    }

    updateExcludeCount();
}


function updateExcludeCount() {

    const button =
        document.querySelector(".exclude-btn");

    if (!button) return;

    const count =
        excludedCharacters.size;

    button.textContent =
        count > 0
            ? `🚫 EXCLUDE CHARACTERS (${count})`
            : "🚫 EXCLUDE CHARACTERS";
}


function clearExcluded() {

    excludedCharacters.clear();

    buildHeroList();
}


function excludeAll() {

    if (!Array.isArray(characters)) return;

    characters.forEach(character => {
        excludedCharacters.add(character.name);
    });

    buildHeroList();
}


function toggleExcludePanel() {

    const panel =
        document.getElementById("excludePanel");

    panel.classList.toggle("open");
}


/* =========================================================
   ROLE
========================================================= */

function setRole(role) {

    selectedRole = role;

    document
        .querySelectorAll("[data-role]")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.role === role
            );

        });
}


/* =========================================================
   COUNT
========================================================= */

function setCount(count) {

    selectedCount = count;

    document
        .querySelectorAll("[data-count]")
        .forEach(button => {

            button.classList.toggle(
                "active",
                Number(button.dataset.count) === count
            );

        });

    updateResultsLayout();
}


function updateResultsLayout() {

    const results =
        document.getElementById("results");

    if (!results) return;

    results.classList.remove(
        "count-1",
        "count-2",
        "count-3"
    );

    results.classList.add(
        `count-${selectedCount}`
    );
}


/* =========================================================
   AVAILABLE CHARACTERS
========================================================= */

function getAvailableCharacters() {

    if (!Array.isArray(characters)) {
        return [];
    }

    return characters.filter(character => {

        if (
            excludedCharacters.has(
                character.name
            )
        ) {
            return false;
        }

        if (selectedRole === "ALL") {
            return true;
        }

        const roles =
            String(character.role)
                .split("/")
                .map(role => role.trim());

        return roles.includes(selectedRole);

    });
}


/* =========================================================
   UNIQUE RANDOM
========================================================= */

function getRandomCharacters(pool, amount) {

    const copy = [...pool];

    const selected = [];

    while (
        selected.length < amount &&
        copy.length > 0
    ) {

        const index =
            Math.floor(
                Math.random() * copy.length
            );

        selected.push(
            copy.splice(index, 1)[0]
        );
    }

    return selected;
}


/* =========================================================
   RENDER
========================================================= */

function renderCharacters(
    list,
    visible = true
) {

    const container =
        document.getElementById("results");

    container.innerHTML = "";

    list.forEach((character, index) => {

        const card =
            document.createElement("div");

        card.className =
            "result-card" +
            (visible ? " show" : "");

        const number =
            document.createElement("div");

        number.className =
            "result-number";

        number.textContent =
            `SLOT ${String(index + 1).padStart(2, "0")}`;

        const name =
            document.createElement("div");

        name.className =
            "result-name";

        name.textContent =
            character.name;

        const role =
            document.createElement("div");

        role.className =
            "result-role";

        role.textContent =
            character.role;

        card.appendChild(number);
        card.appendChild(name);
        card.appendChild(role);

        container.appendChild(card);

    });

    updateResultsLayout();
}


/* =========================================================
   RANDOMIZER
========================================================= */

async function randomizeCharacters() {

    if (spinning) return;

    initAudio();

    const pool =
        getAvailableCharacters();

    if (pool.length < selectedCount) {

        document.getElementById("status")
            .textContent =
            "NOT ENOUGH CHARACTERS";

        return;
    }

    spinning = true;

    const button =
        document.getElementById(
            "randomizeBtn"
        );

    const stage =
        document.getElementById("stage");

    const status =
        document.getElementById("status");

    button.disabled = true;

    stage.classList.add(
        "randomizing"
    );

    stage.classList.remove(
        "winner"
    );

    status.textContent =
        "SELECTING";

    const duration = 3000;

    const start =
        performance.now();

    let lastTick = 0;

    const animate = (time) => {

        const elapsed =
            time - start;

        const progress =
            Math.min(
                elapsed / duration,
                1
            );

        const easing =
            1 - Math.pow(
                1 - progress,
                3
            );

        const interval =
            45 + easing * 180;

        if (
            time - lastTick >
            interval
        ) {

            const preview =
                getRandomCharacters(
                    pool,
                    selectedCount
                );

            renderCharacters(
                preview,
                true
            );

            playTick(
                1 - progress
            );

            lastTick = time;
        }

        if (progress < 1) {

            requestAnimationFrame(
                animate
            );

        } else {

            finishRandomizer();
        }
    };

    requestAnimationFrame(animate);
}


function finishRandomizer() {

    const pool =
        getAvailableCharacters();

    const finalCharacters =
        getRandomCharacters(
            pool,
            selectedCount
        );

    renderCharacters(
        finalCharacters,
        true
    );

    document.getElementById("status")
        .textContent =
        "SELECTED";

    document
        .getElementById("stage")
        .classList.remove(
            "randomizing"
        );

    document
        .getElementById("stage")
        .classList.add(
            "winner"
        );

    playFinalSound();

    spinning = false;

    document.getElementById(
        "randomizeBtn"
    ).disabled = false;
}


/* =========================================================
   BROADCAST MODE
========================================================= */

function setBroadcastMode(enabled) {

    document.body.classList.toggle(
        "broadcast-mode",
        enabled
    );

    const toggle =
        document.getElementById(
            "broadcastToggle"
        );

    const indicator =
        document.getElementById(
            "modeIndicator"
        );

    if (enabled) {

        toggle.textContent =
            "EXIT BROADCAST";

        toggle.classList.add(
            "active"
        );

        indicator.textContent =
            "BROADCAST MODE";

    } else {

        toggle.textContent =
            "BROADCAST MODE";

        toggle.classList.remove(
            "active"
        );

        indicator.textContent =
            "STANDARD MODE";
    }
}


function toggleBroadcastMode() {

    const enabled =
        !document.body.classList.contains(
            "broadcast-mode"
        );

    setBroadcastMode(enabled);

    updateBroadcastURL(enabled);
}


function updateBroadcastURL(enabled) {

    const url =
        new URL(
            window.location.href
        );

    if (enabled) {
        url.searchParams.set(
            "broadcast",
            "1"
        );
    } else {
        url.searchParams.delete(
            "broadcast"
        );
    }

    window.history.replaceState(
        {},
        "",
        url
    );
}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key.toLowerCase() === "b" &&
            !event.ctrlKey &&
            !event.altKey &&
            !event.metaKey
        ) {

            toggleBroadcastMode();

        }

        if (
            event.code === "Space" &&
            !event.repeat
        ) {

            const active =
                document.activeElement;

            const typing =
                active &&
                (
                    active.tagName === "INPUT" ||
                    active.tagName === "TEXTAREA"
                );

            if (!typing) {

                event.preventDefault();

                randomizeCharacters();

            }

        }

    }
);


/* =========================================================
   INITIALIZATION
========================================================= */

function initialize() {

    buildHeroList();

    updateResultsLayout();

    const params =
        new URLSearchParams(
            window.location.search
        );

    if (
        params.get("broadcast") === "1"
    ) {

        setBroadcastMode(true);

    }

}

initialize();

</script>
